name: Persona Orchestration V1 CI

on:
  push:
    branches: [main]
    paths:
      - 'apps-script/personaOrchestrationGate.gs'
      - 'apps-script/personaOrchestrator.gs'
      - 'apps-script/personaLearning10m.gs'
      - 'contracts/persona-orchestration-v1.json'
      - '.github/workflows/persona-orchestration-v1-ci.yml'
  pull_request:
    paths:
      - 'apps-script/personaOrchestrationGate.gs'
      - 'apps-script/personaOrchestrator.gs'
      - 'apps-script/personaLearning10m.gs'
      - 'contracts/persona-orchestration-v1.json'
      - '.github/workflows/persona-orchestration-v1-ci.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse factory canonical gate and learning companion together
        run: |
          cat apps-script/personaOrchestrationGate.gs apps-script/personaOrchestrator.gs apps-script/personaLearning10m.gs > /tmp/personaCombined.js
          node --check /tmp/personaCombined.js
      - name: Validate reconciled contract JSON
        run: |
          node <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('contracts/persona-orchestration-v1.json','utf8'));
          if(x.contractId!=='PERSONA_ORCHESTRATION_V1') process.exit(1);
          if(x.version!=='1.2.0') process.exit(1);
          if(x.rules.failClosed!==true) process.exit(1);
          if(x.rules.promotionTruthOnlyInCanonicalGate!==true) process.exit(1);
          if(x.rules.providerInvocationInFactorySource!==false) process.exit(1);
          if(x.rules.paidGeminiDeveloperApiDefault!==false) process.exit(1);
          if(x.rules.duplicateDailyTriggerForbidden!==true) process.exit(1);
          if(x.rules.verifiedOnlyTemplatePromotion!==true) process.exit(1);
          if(x.runtimeLimits.schedulerMode!=='EXISTING_5M_FACTORY_WAKE_WITH_10M_DUE_GUARD') process.exit(1);
          if(x.runtimeLimits.learningEveryMinutes!==10) process.exit(1);
          NODE
      - name: Enforce canonical delegation learning and no duplicate clock
        shell: bash
        run: |
          grep -q "function assertPersonaPackagePromotionAllowed_" apps-script/personaOrchestrationGate.gs
          grep -q "function runGeminiProjectCrosscheckGate_" apps-script/personaOrchestrationGate.gs
          grep -q "function matchPersonaForContent_" apps-script/personaOrchestrator.gs
          grep -q "function collectRecurringPersonaErrors_" apps-script/personaOrchestrator.gs
          grep -q "function runPersonaLearningCycle10mIfDue_" apps-script/personaLearning10m.gs
          grep -q "function ensurePersonaLearning10mTrigger_" apps-script/personaLearning10m.gs
          grep -q "PERSONA_SEED_CANDIDATE" apps-script/personaLearning10m.gs
          grep -q "PERSONA_ERROR_LEARNING" apps-script/personaLearning10m.gs
          grep -q "PERSONA_TEMPLATE_PATCH_CANDIDATE" apps-script/personaLearning10m.gs
          grep -q "installNewTrigger: false" apps-script/personaLearning10m.gs
          ! grep -q "ScriptApp.newTrigger" apps-script/personaLearning10m.gs
          ! grep -Eiq "generativelanguage\.googleapis\.com|GEMINI_API_KEY|GOOGLE_API_KEY" apps-script/personaLearning10m.gs
      - name: Load all modules without global redeclaration conflict
        run: |
          node <<'NODE'
          const fs=require('fs'), vm=require('vm'), assert=require('assert');
          const code=fs.readFileSync('apps-script/personaOrchestrationGate.gs','utf8')+'\n'+fs.readFileSync('apps-script/personaOrchestrator.gs','utf8')+'\n'+fs.readFileSync('apps-script/personaLearning10m.gs','utf8');
          const sandbox={Object,String,Array,Date,JSON,RegExp,Math,Set};
          vm.createContext(sandbox);
          vm.runInContext(code,sandbox);
          assert.strictEqual(sandbox.PERSONA_ORCH_V1.pass,'PASS');
          assert.strictEqual(sandbox.PERSONA_FACTORY_V1.runtime.schedulerMode,'EXISTING_5M_FACTORY_WAKE');
          assert.strictEqual(sandbox.PERSONA_LEARNING_10M_V1.intervalMinutes,10);
          assert.strictEqual(sandbox.PERSONA_LEARNING_10M_V1.schedulerMode,'EXISTING_5M_FACTORY_WAKE_WITH_10M_DUE_GUARD');
          assert.strictEqual(typeof sandbox.runPersonaLearningCycle10mIfDue_,'function');
          console.log('canonical gate + persona factory + 10m learning companion combined-load PASS');
          NODE
