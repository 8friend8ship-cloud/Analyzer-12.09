name: Patch Content OS central front

on:
  push:
    branches:
      - fix/contentos-latest-keyword-index-20260821
    paths:
      - .github/workflows/patch-contentos-central-front.yml

permissions:
  contents: write

jobs:
  patch-front:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/contentos-latest-keyword-index-20260821
          fetch-depth: 0
      - name: Route Dashboard searches through central backdata
        shell: python
        run: |
          from pathlib import Path
          p = Path('components/Dashboard.tsx')
          s = p.read_text(encoding='utf-8')

          replacements = [
            ("import { fetchYouTubeData, fetchChannelSearchData } from '../services/youtubeService'; // Updated import",
             "import { fetchCentralBackdata } from '../services/centralBackdataService';"),
            ("    const hasApiKey = !!appSettings.apiKeys.youtube;\n\n", ""),
            ('''        if (!hasApiKey) {\n            setError("시스템 API 키가 설정되지 않았습니다. 관리자에게 문의해주세요. (System API key is not set.)");\n            return;\n        }\n        \n        const apiKey = appSettings.apiKeys.youtube;\n        \n''', ""),
            ('''        try {\n            if (searchMode === 'channel') {\n                const channelData = await fetchChannelSearchData(searchQuery, filters, apiKey!);\n                setChannelResults(channelData);\n            } else { // video mode\n                const videoData = await fetchYouTubeData('keyword', searchQuery, filters, apiKey!);\n                setVideos(videoData);\n            }\n        } catch (err: any) {''',
             '''        try {\n            const central = await fetchCentralBackdata(searchQuery, filters, searchMode);\n            if (searchMode === 'channel') {\n                setChannelResults(central.channels || []);\n            } else {\n                setVideos(central.videos || []);\n            }\n            if ((central.status === 'COLLECTING' || central.status === 'REFRESH_REQUIRED') && !central.videos?.length && !(central.channels || []).length) {\n                console.info('[Content OS] central backdata refresh pending:', central.message || central.status);\n            }\n        } catch (err: any) {'''),
            ("    }, [user, onUpdateUser, appSettings, filters, hasApiKey]);",
             "    }, [user, onUpdateUser, filters]);"),
            ("                                Live API Connected", "                                Central Backdata Connected"),
            ("                            Content OS is now connected to the official YouTube Data API and Gemini AI.",
             "                            Content OS searches the central Queens → Seed → T1 → T2 backdata path without a browser API key."),
            ("                            <br/><span className=\"text-xs text-gray-500\">(Content OS가 YouTube 공식 API 및 Gemini AI에 연결되었습니다.)</span>",
             "                            <br/><span className=\"text-xs text-gray-500\">(Content OS는 브라우저 API 키 없이 중앙 Queens → Seed → T1 → T2 백데이터를 조회합니다.)</span>"),
            ("                                    <b className=\"text-white\">Real-time Data:</b> All analysis results are based on real-time data from YouTube.",
             "                                    <b className=\"text-white\">Backdata Search:</b> Results are served from central stored data and missing coverage is sent back to Queens for refresh."),
            ("                                    <br/><span className=\"text-gray-500 text-xs\">(모든 분석 결과는 YouTube의 실시간 데이터를 기반으로 합니다.)</span>",
             "                                    <br/><span className=\"text-gray-500 text-xs\">(중앙 저장 데이터에서 조회하고 부족한 검색어는 Queens 재수집 대상으로 보냅니다.)</span>"),
            ("                                    <b className=\"text-white\">AI Insights:</b> Gemini AI provides deep strategic insights for your content.",
             "                                    <b className=\"text-white\">Seed/T1/T2:</b> Qualified Seed and templates feed downstream analysis features."),
            ("                                    <br/><span className=\"text-gray-500 text-xs\">(Gemini AI가 콘텐츠에 대한 깊이 있는 전략적 인사이트를 제공합니다.)</span>",
             "                                    <br/><span className=\"text-gray-500 text-xs\">(검증 Seed와 1·2차 템플릿이 후속 분석 기능에 공급됩니다.)</span>"),
          ]

          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'Expected source block not found: {old[:100]!r}')
              s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')
      - name: Verify no direct search service remains in Dashboard
        run: |
          grep -q "fetchCentralBackdata" components/Dashboard.tsx
          if grep -q "fetchYouTubeData\|fetchChannelSearchData\|hasApiKey" components/Dashboard.tsx; then
            echo "Direct YouTube search path still present in Dashboard" >&2
            exit 1
          fi
      - name: Commit patch
        run: |
          git config user.name "content-os-bot"
          git config user.email "homedesigntaedi@gmail.com"
          git add components/Dashboard.tsx
          git commit -m "fix(content-os): route Dashboard search through central backdata"
          git push origin HEAD:fix/contentos-latest-keyword-index-20260821
