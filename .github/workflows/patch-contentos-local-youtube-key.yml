          s = s[:old.start()] + new + s[old.end():]
          s = s.replace("    clearCache();\n    setUser(null);", "    clearCache();\n    setAppSettings(prev => ({ ...prev, apiKeys: emptyLocalApiKeys() }));\n    setUser(null);", 1)
          s = s.replace("return <AccountSettings user={user} onNavigate={navigateTo} onUpdateUser={handleUpdateUser} />;", "return <AccountSettings user={user} appSettings={appSettings} onNavigate={navigateTo} onUpdateUser={handleUpdateUser} onUpdateAppSettings={handleUpdateAppSettings} />;")
