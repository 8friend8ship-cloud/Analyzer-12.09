name: Patch Content OS per-login local YouTube key

on:
  push:
    branches:
      - fix/contentos-latest-keyword-index-20260821
    paths:
      - .github/workflows/patch-contentos-local-youtube-key.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/contentos-latest-keyword-index-20260821
          fetch-depth: 0

      - name: Patch per-login local YouTube API mode
        shell: python
        run: |
          from pathlib import Path
          import re

          # Browser-only per-login key helper.
          Path('services/localApiKeyService.ts').write_text(r'''import type { AppSettings } from '../types';

const PREFIX = 'contents-os:local-api-keys:v1:';

const storageKey = (userId: string) => `${PREFIX}${userId}`;

export const emptyLocalApiKeys = (): AppSettings['apiKeys'] => ({
  youtube: '',
  analytics: '',
  reporting: '',
  gemini: '',
});

export const loadLocalApiKeys = (userId: string): AppSettings['apiKeys'] => {
  try {
    const raw = window.localStorage.getItem(storageKey(userId));
    if (!raw) return emptyLocalApiKeys();
    const parsed = JSON.parse(raw);
    return {
      youtube: typeof parsed?.youtube === 'string' ? parsed.youtube : '',
      analytics: '',
      reporting: '',
      gemini: '',
    };
  } catch {
    return emptyLocalApiKeys();
  }
};

export const saveLocalYouTubeApiKey = (userId: string, youtube: string) => {
  window.localStorage.setItem(storageKey(userId), JSON.stringify({
    youtube: String(youtube || '').trim(),
  }));
};
''', encoding='utf-8')

          # Small direct YouTube Data API service, independent of central backdata/Gemini.
          Path('services/youtubeDirectService.ts').write_text(r'''import type { VideoData, FilterState, ChannelRankingData } from '../types';

const BASE_URL = 'https://www.googleapis.com/youtube/v3';
const countryToLangCode: Record<string, string> = {
  US:'en', GB:'en', CA:'en', AU:'en', SG:'en', PH:'en', NZ:'en', KR:'ko', JP:'ja',
  DE:'de', FR:'fr', CN:'zh-Hans', HK:'zh-Hant', TW:'zh-Hant', RU:'ru', VN:'vi',
  ID:'id', TH:'th', MY:'ms', BN:'ms', MX:'es', CL:'es', PE:'es', IN:'hi', BR:'pt'
};

const apiGet = async (endpoint: string, params: Record<string,string>, apiKey: string) => {
  const key = String(apiKey || '').trim();
  if (!key) throw new Error('YouTube API 키가 없습니다. 계정 > API 키에서 이 기기에 개인 키를 저장해주세요.');
  const url = new URL(`${BASE_URL}/${endpoint}`);
  Object.entries(params).forEach(([k,v]) => v !== '' && url.searchParams.set(k, v));
  url.searchParams.set('key', key);
  const response = await fetch(url.toString());
  const body = await response.json().catch(() => ({}));
  if (!response.ok) {
    const message = body?.error?.message || `YouTube API error ${response.status}`;
    throw new Error(message);
  }
  return body;
};

const parseDurationMinutes = (value: string) => {
  const m = String(value || '').match(/PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/);
  return ((Number(m?.[1] || 0) * 60) + Number(m?.[2] || 0) + Number(m?.[3] || 0) / 60);
};

export const fetchDirectYouTubeVideos = async (query: string, filters: FilterState, apiKey: string): Promise<VideoData[]> => {
  const searchParams: Record<string,string> = {
    part:'snippet', q:query, type:'video', maxResults:String(Math.min(filters.resultsLimit || 25, 50)),
    order: filters.sortBy === 'publishedAt' ? 'date' : filters.sortBy === 'relevance' ? 'relevance' : 'viewCount'
  };
  if (filters.country && filters.country !== 'WW') {
    searchParams.regionCode = filters.country;
    if (countryToLangCode[filters.country]) searchParams.relevanceLanguage = countryToLangCode[filters.country];
  }
  if (filters.videoFormat !== 'any') searchParams.videoDuration = filters.videoFormat === 'shorts' ? 'short' : 'medium';
  if (filters.period !== 'any') {
    const d = new Date(); d.setDate(d.getDate() - Number(filters.period || 30));
    searchParams.publishedAfter = d.toISOString();
  }
  const searched = await apiGet('search', searchParams, apiKey);
  const ids = (searched.items || []).map((x:any) => x?.id?.videoId).filter(Boolean);
  if (!ids.length) return [];

  const videoData = await apiGet('videos', { part:'snippet,statistics,contentDetails', id:ids.join(',') }, apiKey);
  const channelIds = Array.from(new Set((videoData.items || []).map((x:any) => x?.snippet?.channelId).filter(Boolean)));
  const channelData = channelIds.length ? await apiGet('channels', { part:'statistics', id:channelIds.join(',') }, apiKey) : {items:[]};
  const subscriberMap = (channelData.items || []).reduce((acc:any,x:any) => {
    acc[x.id] = Number(x?.statistics?.subscriberCount || 0); return acc;
  }, {});

  return (videoData.items || []).map((x:any): VideoData => {
    const views = Number(x?.statistics?.viewCount || 0);
    const likes = Number(x?.statistics?.likeCount || 0);
    const comments = Number(x?.statistics?.commentCount || 0);
    return {
      id:x.id,
      channelId:x?.snippet?.channelId || '',
      title:x?.snippet?.title || '',
      thumbnailUrl:x?.snippet?.thumbnails?.high?.url || x?.snippet?.thumbnails?.medium?.url || x?.snippet?.thumbnails?.default?.url || '',
      channelTitle:x?.snippet?.channelTitle || '',
      publishedAt:x?.snippet?.publishedAt || '',
      subscribers:subscriberMap[x?.snippet?.channelId] || 0,
      viewCount:views,
      likeCount:likes,
      commentCount:comments,
      durationMinutes:parseDurationMinutes(x?.contentDetails?.duration || ''),
      engagementRate:views > 0 ? ((likes + comments) / views) * 100 : 0,
    };
  });
};

export const fetchDirectYouTubeChannels = async (query: string, filters: FilterState, apiKey: string): Promise<ChannelRankingData[]> => {
  const params: Record<string,string> = { part:'snippet', q:query, type:'channel', maxResults:String(Math.min(filters.resultsLimit || 25, 50)) };
  if (filters.country && filters.country !== 'WW') {
    params.regionCode = filters.country;
    if (countryToLangCode[filters.country]) params.relevanceLanguage = countryToLangCode[filters.country];
  }
  const searched = await apiGet('search', params, apiKey);
  const ids = (searched.items || []).map((x:any) => x?.id?.channelId).filter(Boolean);
  if (!ids.length) return [];
  const data = await apiGet('channels', { part:'snippet,statistics', id:ids.join(',') }, apiKey);
  return (data.items || []).map((x:any,index:number): ChannelRankingData => ({
    id:x.id,
    name:x?.snippet?.title || '',
    channelHandle:x?.snippet?.customUrl || '',
    thumbnailUrl:x?.snippet?.thumbnails?.default?.url || '',
    subscriberCount:Number(x?.statistics?.subscriberCount || 0),
    newSubscribersInPeriod:0,
    newViewsInPeriod:0,
    videoCount:Number(x?.statistics?.videoCount || 0),
    viewCount:Number(x?.statistics?.viewCount || 0),
    rank:index + 1,
    rankChange:0,
    channelCountry:x?.snippet?.country || '',
    description:x?.snippet?.description || '',
  }));
};
