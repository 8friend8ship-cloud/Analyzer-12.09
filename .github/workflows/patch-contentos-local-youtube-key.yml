          end = s.find("    const handlePopularQuerySelect", start)
          if start < 0 or end < 0: raise SystemExit('Dashboard analysis anchors missing')
          handler = r'''    const handleAnalysis = useCallback(async (searchQuery: string, searchMode: SearchTab) => {
        if (user.usage.search.used >= user.usage.search.limit) {
            setIsUpgradeModalOpen(true);
            return;
        }
        logQuery(searchQuery, searchMode === 'video' ? 'keyword' : 'channel');
        setSelectedChannels({}); setIsInitial(false); setError(null); setVideos([]); setChannelResults([]);
        if (!searchQuery.trim()) {
            setError("키워드 또는 채널 URL을 입력해주세요. (Please enter a keyword or channel URL.)");
            return;
        }
        if (!hasApiKey) {
            setError("YouTube API 키가 없습니다. 우측 상단 계정 → API 키에서 이 기기에 사용할 개인 YouTube Data API v3 키를 저장해주세요.");
            return;
        }
        const apiKey = String(appSettings.apiKeys.youtube || '').trim();
        onUpdateUser({ usage: { ...user.usage, search: { ...user.usage.search, used: user.usage.search.used + 1 } } });
        setIsLoading(true); setLoadingMessage(`'${searchQuery}' YouTube 데이터를 조회 중입니다...`);
        try {
