          s = s.replace("const AccountSettings: React.FC<AccountSettingsProps> = ({ user, onNavigate, onUpdateUser }) => {\n    const [activeTab, setActiveTab] = useState('usage');", "const AccountSettings: React.FC<AccountSettingsProps> = ({ user, appSettings, onNavigate, onUpdateUser, onUpdateAppSettings }) => {\n    const [activeTab, setActiveTab] = useState('usage');\n    const [youtubeKey, setYoutubeKey] = useState(appSettings.apiKeys.youtube || '');\n    const [showYoutubeKey, setShowYoutubeKey] = useState(false);")
