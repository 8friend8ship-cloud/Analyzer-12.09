name: Analyzer quality gate

on:
  pull_request:
  push:
    branches: ["agent/analyzer-security-contract-20260801"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        regression: [first, identical-second]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npm audit --audit-level=high
